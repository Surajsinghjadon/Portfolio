<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj Singh Jadon | Portfolio</title>
    <style>
        body { background: #05070c; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        
        /* Logo Styling */
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-text { font-size: 36px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; }
        
        .card { background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #38bdf8; margin-bottom: 20px; }
        
        /* Earth Animation */
        .earth { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #38bdf8, #000); 
                 margin: 20px auto; animation: rotate 5s linear infinite; box-shadow: inset -15px -15px 20px #000; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #38bdf8; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <div class="logo-box">
        <div class="logo-text">SSJ</div>
        <div style="color: #9ca3af;">Data Analyst & SAP Expert</div>
    </div>

    <div class="earth"></div>

    <div class="card">
        <h3>Terminal Access</h3>
        <p id="status">Status: Guest User</p>
        <button onclick="login()">Login with GitHub</button>
    </div>

    <div class="card">
        <h3>Professional Experience</h3>
        <p>• <strong>Polyhose India:</strong> Invoice SAP Executive</p>

    <div class="card">

        <p>🔗 LinkedIn: /in/suraj-singh-jadon</p>
    </div>
</div>

<script>
    const supabase = window.supabase.createClient("https://ypoxybmhdpxmxcmiimjf.supabase.co", "sb_publishable_FA9NtukWnWCfoKfGL9iwrA_efm-8xSu");
    async function login() { await supabase.auth.signInWithOAuth({ provider: 'github' }); }
    supabase.auth.onAuthStateChange((event, session) => {
        if (session) document.getElementById('status').innerText = "Logged in: " + session.user.email;
    });
</script>
</body>
</html>
