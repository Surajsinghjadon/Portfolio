<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj Singh Jadon - Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS ka jhanjhat khatam, simple layout */
        body { background: #05070c; color: white; font-family: sans-serif; }
        
        /* Fixed Panel */
        #auth-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 999999; display: none; 
            flex-direction: column; align-items: center; justify-content: center;
        }
        
        .social-btn { 
            width: 80%; padding: 20px; margin: 15px; 
            background: #222; color: white; border: 1px solid #444; 
            border-radius: 15px; font-size: 18px; cursor: pointer;
            z-index: 9999999; /* Button ko sabse upar rakha */
        }
    </style>
</head>
<body>

    <!-- Main Content -->
    <div style="text-align:center; padding-top:50px;">
        <button onclick="document.getElementById('auth-overlay').style.display='flex'" 
                style="padding:15px 30px; background:#38bdf8; border:none; border-radius:10px; cursor:pointer;">
            Open Login Panel
        </button>
    </div>

    <!-- Login Panel -->
    <div id="auth-overlay">
        <button onclick="this.parentElement.parentElement.style.display='none'" 
                style="position:absolute; top:20px; right:20px; padding:10px; cursor:pointer;">CLOSE</button>
        
        <h2 style="margin-bottom:30px;">Login Access</h2>
        
        <!-- YEH BUTTONS AB 100% CLICK HONGE -->
        <button class="social-btn" onclick="runLogin('google')">Login with Google</button>
        <button class="social-btn" onclick="runLogin('linkedin_oidc')">Login with LinkedIn</button>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://ypoxybmhdpxmxcmiimjf.supabase.co', 'sb_publishable_FA9NtukWnWCfoKfGL9iwrA_efm-8xSu');
        
        // Direct click function
        window.runLogin = async function(provider) {
            console.log("Button clicked!");
            alert("Connecting to " + provider); 
            await supabase.auth.signInWithOAuth({ provider: provider });
        }
    </script>
</body>
</html>
